spring.application.name=ms2-transaction

server.port=8082

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${TRANSACTION_DB_PORT:5435}/${TRANSACTION_DB_NAME:transactions_db}}
spring.datasource.username=${TRANSACTION_DB_USER}
spring.datasource.password=${TRANSACTION_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

mock-api.account-url=${MOCK_API_ACCOUNT_URL:https://6af3b0e255a1de7dcf032d4c.mockapi.io/v1/account}

ms1.base-url=${MS1_BASE_URL:http://localhost:8081}
